<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可轉債（CB）資訊儀表板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#eeede8;
  --text:#1a1a18;--text2:#6b6b68;--text3:#a0a09c;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
  --info-bg:#e6f1fb;--info-text:#185fa5;
  --ok-bg:#eaf3de;--ok-text:#3b6d11;
  --warn-bg:#faeeda;--warn-text:#854f0b;
  --up:#d85a30;--dn:#1d9e75;
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
  --text:#e8e8e4;--text2:#a0a09c;--text3:#6b6b68;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
  --info-bg:#0c2d4a;--info-text:#85b7eb;
  --ok-bg:#172c08;--ok-text:#97c459;
  --warn-bg:#2a1c06;--warn-text:#ef9f27;
}}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 3rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.tag{font-size:11px;padding:3px 8px;border-radius:4px;background:var(--info-bg);color:var(--info-text);font-weight:500}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-size:13px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--text2);background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r);padding:6px 12px;text-decoration:none}
.btn:hover{background:var(--bg3);color:var(--text)}
.btn-dl{background:var(--ok-bg);color:var(--ok-text);border-color:transparent;font-weight:600}
.sel{font-size:13px;padding:5px 8px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);height:32px;outline:none}
.section-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.logic-box{background:var(--bg2);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;align-items:center;flex-wrap:wrap;gap:0}
.logic-step{flex:1;min-width:110px;padding:.5rem .75rem}
.logic-num{font-size:10px;color:var(--text3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.logic-text{font-size:13px;font-weight:600}
.logic-arrow{color:var(--text3);font-size:18px;padding:0 4px}
.thr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
@media(max-width:500px){.thr-grid{grid-template-columns:1fr}}
.thr-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:.85rem 1rem}
.thr-range{font-size:13px;font-weight:600}
.thr-label{font-size:11px;color:var(--text3);margin:3px 0}
.thr-val{font-size:22px;font-weight:700;color:var(--dn)}
.drop-zone{border:2px dashed var(--border2);border-radius:var(--rl);padding:2rem;text-align:center;margin-bottom:1.5rem;color:var(--text2);cursor:pointer;transition:all 0.2s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--info-text);background:var(--info-bg);color:var(--info-text)}
.drop-icon{font-size:36px;margin-bottom:8px}
.drop-title{font-weight:600;margin-bottom:4px;font-size:15px}
.drop-sub{font-size:12px;color:var(--text3)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
.metric{background:var(--bg2);border-radius:var(--r);padding:.85rem 1rem}
.m-label{font-size:12px;color:var(--text2);margin-bottom:4px}
.m-value{font-size:22px;font-weight:600}
.m-sub{font-size:11px;color:var(--text3);margin-top:2px}
.filter-bar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filter-bar label{font-size:12px;color:var(--text2);white-space:nowrap}
.sort-btn{font-size:12px;padding:5px 10px;height:32px;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);border-radius:var(--r);white-space:nowrap}
.sort-btn.active{background:var(--info-bg);color:var(--info-text);border-color:transparent;font-weight:600}
.table-wrap{overflow-x:auto;border:0.5px solid var(--border);border-radius:var(--rl)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:750px}
thead th{text-align:left;font-weight:600;font-size:11px;color:var(--text2);padding:8px 10px;border-bottom:0.5px solid var(--border);background:var(--bg2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
thead th:hover{color:var(--text)}
tbody td{padding:8px 10px;border-bottom:0.5px solid var(--border);color:var(--text);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg2)}
.code-cell{color:var(--info-text);font-weight:600}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.badge-star{background:var(--ok-bg);color:var(--ok-text)}
.badge-ok{background:var(--info-bg);color:var(--info-text)}
.badge-hi{background:var(--warn-bg);color:var(--warn-text)}
.badge-na{background:var(--bg2);color:var(--text3)}
.bar-row{display:flex;align-items:center;gap:5px}
.bar-val{min-width:48px;font-weight:600}
.bar-track{flex:1;height:6px;border-radius:3px;max-width:60px;background:var(--bg3)}
.bar-fill{height:100%;border-radius:3px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:1.5rem}
@media(max-width:600px){.two-col{grid-template-columns:1fr}}
.chart-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1rem}
.msg{color:var(--text2);font-size:14px;padding:2.5rem;text-align:center}
.warn-box{color:var(--warn-text);font-size:12px;padding:.6rem 1rem;background:var(--warn-bg);border-radius:var(--r);margin-bottom:.75rem}
.data-date{font-size:11px;color:var(--text3);margin-top:1rem;text-align:right}
.data-date a{color:var(--info-text);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="top-bar">
    <div class="page-title">📊 可轉債（CB）資訊儀表板 <span class="tag">台灣 OTC</span></div>
    <div class="top-actions">
      <a class="btn" href="https://www.tpex.org.tw/zh-tw/bond/info/statistics-cb/day.html" target="_blank">↗ 櫃買中心</a>
      <button class="btn btn-dl" onclick="downloadCSV()">⬇ 下載今日 CSV</button>
      <button class="btn" onclick="document.getElementById('fileInput').click()">📂 選擇 CSV 檔案</button>
      <input type="file" id="fileInput" accept=".csv" style="display:none" onchange="handleFile(this.files[0])">
    </div>
  </div>

  <div class="section-label">▌ 資優生挑選邏輯</div>
  <div class="logic-box">
    <div class="logic-step"><div class="logic-num">步驟 1</div><div class="logic-text">轉換收益排列</div></div>
    <div class="logic-arrow">→</div>
    <div class="logic-step"><div class="logic-num">步驟 2</div><div class="logic-text">CB 價格降冪排序</div></div>
    <div class="logic-arrow">→</div>
    <div class="logic-step"><div class="logic-num">步驟 3</div><div class="logic-text">理論價 90–120</div></div>
    <div class="logic-arrow">→</div>
    <div class="logic-step"><div class="logic-num">步驟 4</div><div class="logic-text">挑選高折溢價 %</div></div>
  </div>

  <div class="section-label">▌ 折溢價篩選門檻（每年不同，以 2019 為例）</div>
  <div class="thr-grid">
    <div class="thr-card"><div class="thr-range">理論價 90–100</div><div class="thr-label">最低溢價門檻</div><div class="thr-val">&gt;15%</div></div>
    <div class="thr-card"><div class="thr-range">理論價 100–110</div><div class="thr-label">最低溢價門檻</div><div class="thr-val">&gt;7.5%</div></div>
    <div class="thr-card"><div class="thr-range">理論價 110–120</div><div class="thr-label">最低溢價門檻</div><div class="thr-val">&gt;3.5%</div></div>
  </div>

  <div id="dropZone" class="drop-zone"
    ondragover="event.preventDefault();this.classList.add('drag-over')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="this.classList.remove('drag-over');handleDrop(event)"
    onclick="document.getElementById('fileInput').click()">
    <div class="drop-icon">📄</div>
    <div class="drop-title">拖曳 CSV 檔案到這裡，或點擊選擇</div>
    <div class="drop-sub">每日流程：點「⬇ 下載今日 CSV」→ 將下載的檔案拖曳至此</div>
  </div>

  <div id="metrics-area" style="display:none">
    <div class="metric-grid" id="metric-grid"></div>
  </div>

  <div id="warn-area"></div>

  <div class="two-col" id="charts-area" style="display:none">
    <div class="chart-card">
      <div class="section-label">▌ 溢價率分布</div>
      <div style="position:relative;height:220px"><canvas id="distChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="section-label">▌ CB 收盤價區間分布</div>
      <div style="position:relative;height:220px"><canvas id="pieChart"></canvas></div>
    </div>
  </div>

  <div id="filter-bar" class="filter-bar" style="display:none">
    <label>CB 價格</label>
    <select id="priceFilter" class="sel" onchange="renderTable()">
      <option value="all">全部</option>
      <option value="90-100">90–100</option>
      <option value="100-110">100–110</option>
      <option value="110-120">110–120</option>
      <option value="120+">120+</option>
    </select>
    <label>排序</label>
    <button class="sort-btn active" id="sortPremium" onclick="setSort('premium')">溢價率 ↑</button>
    <button class="sort-btn" id="sortPrice" onclick="setSort('price')">CB價格 ↓</button>
    <button class="sort-btn" id="sortConv" onclick="setSort('conv')">轉換價值 ↓</button>
    <button class="sort-btn" id="sortName" onclick="setSort('name')">名稱</button>
    <input type="text" id="searchBox" class="sel" placeholder="搜尋代號/名稱…" oninput="renderTable()" style="width:130px">
  </div>

  <div id="table-area"></div>

  <div class="data-date" id="dataDate"></div>
</div>

<script>
var allData = [];
var sortKey = 'premium';
var distChart = null, pieChart = null;

// ===== 下載今日 CSV =====
function downloadCSV() {
  var today = new Date();
  var yyyy = today.getFullYear();
  var mm = String(today.getMonth()+1).padStart(2,'0');
  var dd = String(today.getDate()).padStart(2,'0');
  var url = 'https://www.tpex.org.tw/storage/bond_zone/tradeinfo/cb/'+yyyy+'/'+yyyy+mm+'/RSta0113.'+yyyy+mm+dd+'-C.csv';
  window.open(url, '_blank');
}

// ===== 拖曳處理 =====
function handleDrop(event) {
  event.preventDefault();
  var file = event.dataTransfer.files[0];
  if (file) handleFile(file);
}

function handleFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var buf = e.target.result;
    var text;
    try { text = new TextDecoder('big5').decode(buf); } catch(err) { text = new TextDecoder('utf-8').decode(buf); }
    parseCSV(text, file.name);
  };
  reader.readAsArrayBuffer(file);
}

// ===== 解析 CSV =====
async function parseCSV(csvText, filename) {
  document.getElementById('warn-area').innerHTML = '<div class="warn-box" id="loading-msg" style="background:var(--info-bg);color:var(--info-text)">🚀 正在從 GitHub 載入靜態資料，極速分析中...</div>';

  var dm = (filename||'').match(/(\d{8})/);
  var displayDate = dm ? (parseInt(dm[1].slice(0,4))-1911)+'/'+dm[1].slice(4,6)+'/'+dm[1].slice(6,8) : '未知日期';

  var convMap = {};
  var stockMap = {};
  try {
    var timeStamp = '?t=' + new Date().getTime() + Math.random();
    var [convRes, stockRes] = await Promise.all([
      fetch('https://yuishien-a11y.github.io/CB/conv_price.json' + timeStamp),
      fetch('https://yuishien-a11y.github.io/CB/stock_price.json' + timeStamp)
    ]);
    if (convRes.ok) { var j = await convRes.json(); convMap = j.data || {}; }
    if (stockRes.ok) { stockMap = await stockRes.json(); }
  } catch(e) { console.log('載入靜態資料失敗:', e); }

  var rows = [];
  var lines = csvText.split('\n');
  for (var i=0; i<lines.length; i++) {
    var line = lines[i].trim();
    if (!line.startsWith('BODY')) continue;
    var cols = line.split('","').map(function(c){ return c.replace(/^BODY,"|"/g,'').replace(/"/g,'').trim(); });
    if (cols[2] !== '等價') continue;
    var code = cols[0].replace(/BODY,/,'').trim();
    if (!code || code === '合計') continue;
    if (!/^\d{4,6}$/.test(code)) continue;
    var cbPrice = parseFloat(cols[3].replace(/,/g,'')) || parseFloat(cols[12].replace(/,/g,'')) || 0;
    if (cbPrice < 70 || cbPrice > 600) continue;
    
    var conv = convMap[code] || {};
    var stockCode = conv.stock_code || code.slice(0,-1);
    var sp = stockMap[stockCode] || 0;
    var cp = conv.conv_price || 0;
    
    var cv = 0, premium = 0;
    if (cp > 0 && sp > 0 && cbPrice > 0) {
      cv = parseFloat((sp / cp * 100).toFixed(2));
      if (cv > 0) premium = parseFloat(((cbPrice / cv - 1) * 100).toFixed(2));
    }

    rows.push({
      code: code,
      name: cols[1].trim(),
      cbPrice: cbPrice,
      change: parseFloat(cols[4].replace(/,/g,'')) || 0,
      convPrice: cp,
      maturity: conv.maturity || '',
      stockCode: stockCode,
      stockPrice: sp,
      convValue: cv,
      premium: premium,
      convRatio: conv.conv_ratio  // 💡 讀取剛才腳本算出的已轉換比例
    });
  }

  if (rows.length === 0) {
    document.getElementById('warn-area').innerHTML = '<div class="warn-box">⚠ 無法解析，請確認是正確的可轉債行情 CSV 檔案</div>';
    return;
  }

  allData = rows;
  
  if (Object.keys(stockMap).length > 0) {
      document.getElementById('warn-area').innerHTML = '';
  } else {
      document.getElementById('warn-area').innerHTML = '<div class="warn-box">⚠ 提醒：尚未讀取到 stock_price.json 股價資料。請確認 GitHub Actions 是否已成功產出並上傳該檔案。</div>';
  }

  document.getElementById('dropZone').style.display = 'none';
  document.getElementById('metrics-area').style.display = '';
  document.getElementById('filter-bar').style.display = 'flex';
  document.getElementById('dataDate').innerHTML =
    '資料日期：'+displayDate+'（民國）&nbsp;·&nbsp;共 '+rows.length+' 檔&nbsp;·&nbsp;' +
    '<a href="#" onclick="resetUpload();return false">重新上傳</a>';
  
  renderMetrics(rows);
  renderCharts(rows);
  renderTable();
}

function resetUpload() {
  document.getElementById('dropZone').style.display = '';
  document.getElementById('metrics-area').style.display = 'none';
  document.getElementById('filter-bar').style.display = 'none';
  document.getElementById('table-area').innerHTML = '';
  document.getElementById('charts-area').style.display = 'none';
  document.getElementById('warn-area').innerHTML = '';
  document.getElementById('dataDate').innerHTML = '';
  allData = [];
}

// ===== 排序 =====
function setSort(k) {
  sortKey = k;
  document.querySelectorAll('.sort-btn').forEach(function(b){ b.classList.remove('active'); });
  var map = {premium:'sortPremium', price:'sortPrice', conv:'sortConv', name:'sortName'};
  document.getElementById(map[k]).classList.add('active');
  renderTable();
}

function getFiltered() {
  var pf = document.getElementById('priceFilter').value;
  var q = document.getElementById('searchBox').value.toLowerCase().trim();
  var d = allData.slice();
  if (pf !== 'all') {
    var lo = pf === '120+' ? 120 : parseFloat(pf.split('-')[0]);
    var hi = pf === '120+' ? 9999 : parseFloat(pf.split('-')[1]);
    d = d.filter(function(x){ return x.cbPrice >= lo && x.cbPrice < hi; });
  }
  if (q) d = d.filter(function(x){ return x.code.includes(q) || x.name.includes(q); });
  if (sortKey === 'premium') d.sort(function(a,b){ return a.premium - b.premium; });
  else if (sortKey === 'price') d.sort(function(a,b){ return b.cbPrice - a.cbPrice; });
  else if (sortKey === 'conv') d.sort(function(a,b){ return b.convValue - a.convValue; });
  else d.sort(function(a,b){ return a.name.localeCompare(b.name,'zh'); });
  return d;
}

// ===== 評等 =====
function badge(p, cv) {
  if (cv <= 0) return '<span class="badge badge-na">—</span>';
  if (p <= 0) return '<span class="badge badge-star" style="background:#1d9e75;color:#fff">🔥 折價</span>';
  if (p > 0 && p <= 15) return '<span class="badge badge-star">⭐ 低溢價</span>';
  if (p > 15 && p <= 30) return '<span class="badge badge-ok">觀察</span>';
  if (p > 30 && p <= 60) return '<span class="badge badge-hi">偏高</span>';
  return '<span class="badge badge-na">高溢價</span>';
}

// ===== 指標卡 =====
function renderMetrics(data) {
  var avgCB = data.reduce(function(s,x){return s+x.cbPrice;},0)/data.length;
  var withPremium = data.filter(function(x){return x.convValue > 0;});
  var avgP = withPremium.length ? withPremium.reduce(function(s,x){return s+x.premium;},0)/withPremium.length : 0;
  var low = data.filter(function(x){return x.convValue > 0 && x.premium <= 15;}).length;
  var under110 = data.filter(function(x){return x.cbPrice < 110;}).length;
  var withConv = data.filter(function(x){return x.convPrice > 0;}).length;
  document.getElementById('metric-grid').innerHTML =
    '<div class="metric"><div class="m-label">可轉債總數</div><div class="m-value">'+data.length+'</div><div class="m-sub">本次載入</div></div>'+
    '<div class="metric"><div class="m-label">平均 CB 收盤</div><div class="m-value">'+avgCB.toFixed(1)+'</div><div class="m-sub">元</div></div>'+
    '<div class="metric"><div class="m-label">平均轉換溢價率</div><div class="m-value">'+avgP.toFixed(1)+'%</div><div class="m-sub">有溢價資料者</div></div>'+
    '<div class="metric"><div class="m-label">低溢價 / 折價（≤15%）</div><div class="m-value" style="color:var(--dn)">'+low+'</div><div class="m-sub">資優生候選</div></div>'+
    '<div class="metric"><div class="m-label">CB價格 &lt;110</div><div class="m-value">'+under110+'</div><div class="m-sub">具安全邊際</div></div>'+
    '<div class="metric"><div class="m-label">有轉換價資料</div><div class="m-value">'+withConv+'</div><div class="m-sub">可計算溢價率</div></div>';
}

// ===== 表格 =====
function renderTable() {
  var d = getFiltered();
  if (!d.length) { document.getElementById('table-area').innerHTML='<div class="msg">無符合條件的資料</div>'; return; }
  
  // 💡 在表頭新增了「已轉換」的欄位，並加上說明文字
  var html = '<div class="table-wrap"><table><thead><tr>'+
    '<th>代號</th><th>名稱</th><th>CB收盤</th><th>漲跌</th>'+
    '<th title="轉換價值=現股÷轉換價×100">轉換價值</th>'+
    '<th title="轉換溢價率越低越便宜">溢價率</th>'+
    '<th>現股價</th><th>轉換價</th><th>到期日</th><th title="已轉換比例 = (發行面額 - 尚未轉換本金) / 發行面額">已轉換</th><th>評等</th>'+
    '</tr></thead><tbody>';
    
  for (var i=0; i<d.length; i++) {
    var x = d[i];
    var cc = x.change > 0 ? 'var(--up)' : x.change < 0 ? 'var(--dn)' : 'var(--text3)';
    
    var pc = x.convValue > 0 ? (x.premium < 0 ? 'var(--dn)' : x.premium <= 15 ? 'var(--dn)' : x.premium <= 30 ? 'var(--info-text)' : x.premium > 60 ? 'var(--up)' : 'var(--text)') : 'var(--text3)';
    var bw = x.convValue > 0 && x.premium !== 0 ? Math.min(Math.abs(x.premium)*1.2, 60) : 0;
    var ps = x.convValue > 0 ? (x.premium > 0 ? '+' : '') + x.premium.toFixed(1) + '%' : '—';
    var cvs = x.convValue > 0 ? x.convValue.toFixed(2) : '—';
    
    // 💡 處理已轉換比例，如果大於等於 80% 會用紅色警示
    var crColor = (x.convRatio >= 80) ? 'var(--up)' : 'var(--text2)';
    var crs = (x.convRatio !== undefined && x.convRatio !== null) ? x.convRatio.toFixed(1) + '%' : '—';
    
    html += '<tr>'+
      '<td class="code-cell">'+x.code+'</td>'+
      '<td style="max-width:90px;overflow:hidden;text-overflow:ellipsis">'+x.name+'</td>'+
      '<td style="font-weight:600">'+x.cbPrice.toFixed(1)+'</td>'+
      '<td style="color:'+cc+';font-weight:500">'+(x.change>0?'+':'')+x.change.toFixed(2)+'</td>'+
      '<td>'+cvs+'</td>'+
      '<td><div class="bar-row"><span class="bar-val" style="color:'+pc+'">'+ps+'</span>'+
        (bw>0?'<div class="bar-track"><div class="bar-fill" style="width:'+bw+'px;background:'+pc+'"></div></div>':'')+
      '</div></td>'+
      '<td>'+(x.stockPrice>0?x.stockPrice.toFixed(2):'—')+'</td>'+
      '<td>'+(x.convPrice>0?x.convPrice.toFixed(2):'—')+'</td>'+
      '<td style="font-size:12px;color:var(--text3)">'+(x.maturity||'—')+'</td>'+
      '<td style="font-size:12px;color:'+crColor+';font-weight:600">'+crs+'</td>'+
      '<td>'+badge(x.premium, x.convValue > 0)+'</td>'+
    '</tr>';
  }
  html += '</tbody></table></div>';
  document.getElementById('table-area').innerHTML = html;
}

// ===== 圖表 =====
function renderCharts(data) {
  if (typeof Chart === 'undefined') {
    document.getElementById('charts-area').style.display = 'block';
    document.getElementById('charts-area').innerHTML = '<div class="msg">圖表套件載入中斷，請確認網路連線是否阻擋了外部腳本。</div>';
    return;
  }
  
  document.getElementById('charts-area').style.display = 'grid';

  var buckets = [{l:'<0%(折價)',lo:-9999,hi:0}, {l:'1-15%',lo:0.01,hi:15},{l:'16-30%',lo:15.01,hi:30},{l:'31-60%',lo:30.01,hi:60},{l:'>60%',lo:60.01,hi:9999}];
  var counts = buckets.map(function(b){ return data.filter(function(x){ return x.convValue>0 && x.premium>=b.lo && x.premium<=b.hi; }).length; });
  var colors = ['#0c2d4a', '#1d9e75','#185fa5','#d85a30','#854f0b'];

  if (distChart) distChart.destroy();
  distChart = new Chart(document.getElementById('distChart'), {
    type: 'bar',
    data: { labels: buckets.map(function(b){return b.l;}), datasets: [{data:counts,backgroundColor:colors,borderRadius:4}] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{x:{ticks:{font:{size:11},color:'#888'},grid:{display:false}},y:{ticks:{font:{size:11},color:'#888'},grid:{color:'rgba(128,128,128,0.1)'}}}
    }
  });

  var pb = [{l:'<100',lo:0,hi:100},{l:'100-110',lo:100,hi:110},{l:'110-120',lo:110,hi:120},{l:'>120',lo:120,hi:9999}];
  var pc = pb.map(function(b){ return data.filter(function(x){ return x.cbPrice>=b.lo&&x.cbPrice<b.hi; }).length; });
  var total = pc.reduce(function(a,b){return a+b;},0);

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: { labels: pb.map(function(b){return b.l;}), datasets:[{data:pc,backgroundColor:['#185fa5','#1d9e75','#d85a30','#854f0b'],borderWidth:0,hoverOffset:6}] },
    options: { responsive:true, maintainAspectRatio:false,
      plugins: {
        legend: { position:'right', labels:{ font:{size:11}, boxWidth:10, padding:8,
          generateLabels: function(chart) {
            var ds = chart.data.datasets[0];
            return chart.data.labels.map(function(label,i) {
              return { text:label+'  '+(total>0?Math.round(ds.data[i]/total*100):0)+'%',
                fillStyle:ds.backgroundColor[i], strokeStyle:ds.backgroundColor[i], lineWidth:0, index:i };
            });
          }
        }},
        tooltip: { callbacks: { label: function(ctx) {
          return ' '+ctx.parsed+' 檔 ('+(total>0?(ctx.parsed/total*100).toFixed(1):0)+'%)';
        }}}
      }
    }
  });
}
</script>
</body>
</html>
