<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可轉債（CB）資訊儀表板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#eeede8;
  --text:#1a1a18;--text2:#6b6b68;--text3:#a0a09c;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
  --info-bg:#e6f1fb;--info-text:#185fa5;
  --ok-bg:#eaf3de;--ok-text:#3b6d11;
  --warn-bg:#faeeda;--warn-text:#854f0b;
  --up:#d85a30;--dn:#1d9e75;
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
  --text:#e8e8e4;--text2:#a0a09c;--text3:#6b6b68;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
  --info-bg:#0c2d4a;--info-text:#85b7eb;
  --ok-bg:#172c08;--ok-text:#97c459;
  --warn-bg:#2a1c06;--warn-text:#ef9f27;
}}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 3rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.tag{font-size:11px;padding:3px 8px;border-radius:4px;background:var(--info-bg);color:var(--info-text);font-weight:500}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-size:13px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--text2);background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r);padding:6px 12px;text-decoration:none}
.btn:hover{background:var(--bg3);color:var(--text)}
.sel{font-size:13px;padding:5px 8px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);height:32px;outline:none}
.section-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
/* Logic */
.logic-box{background:var(--bg2);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;align-items:center;flex-wrap:wrap;gap:0}
.logic-step{flex:1;min-width:110px;padding:.5rem .75rem}
.logic-num{font-size:10px;color:var(--text3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.logic-text{font-size:13px;font-weight:600}
.logic-arrow{color:var(--text3);font-size:18px;padding:0 4px}
/* Thresholds */
.thr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
@media(max-width:500px){.thr-grid{grid-template-columns:1fr}}
.thr-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:.85rem 1rem}
.thr-range{font-size:13px;font-weight:600}
.thr-label{font-size:11px;color:var(--text3);margin:3px 0}
.thr-val{font-size:22px;font-weight:700;color:var(--dn)}
/* Metrics */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
.metric{background:var(--bg2);border-radius:var(--r);padding:.85rem 1rem}
.m-label{font-size:12px;color:var(--text2);margin-bottom:4px}
.m-value{font-size:22px;font-weight:600}
.m-sub{font-size:11px;color:var(--text3);margin-top:2px}
/* Filter */
.filter-bar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filter-bar label{font-size:12px;color:var(--text2);white-space:nowrap}
.sort-btn{font-size:12px;padding:5px 10px;height:32px;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);border-radius:var(--r);white-space:nowrap}
.sort-btn.active{background:var(--info-bg);color:var(--info-text);border-color:transparent;font-weight:600}
/* Table */
.table-wrap{overflow-x:auto;border:0.5px solid var(--border);border-radius:var(--rl)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
thead th{text-align:left;font-weight:600;font-size:11px;color:var(--text2);padding:8px 10px;border-bottom:0.5px solid var(--border);background:var(--bg2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
thead th:hover{color:var(--text)}
tbody td{padding:8px 10px;border-bottom:0.5px solid var(--border);color:var(--text);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg2)}
.code-cell{color:var(--info-text);font-weight:600}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.badge-star{background:var(--ok-bg);color:var(--ok-text)}
.badge-ok{background:var(--info-bg);color:var(--info-text)}
.badge-hi{background:var(--warn-bg);color:var(--warn-text)}
.badge-na{background:var(--bg2);color:var(--text3)}
.bar-row{display:flex;align-items:center;gap:5px}
.bar-val{min-width:48px;font-weight:600}
.bar-track{flex:1;height:6px;border-radius:3px;max-width:60px;background:var(--bg3)}
.bar-fill{height:100%;border-radius:3px}
/* Charts */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:1.5rem}
@media(max-width:600px){.two-col{grid-template-columns:1fr}}
.chart-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1rem}
/* States */
.msg{color:var(--text2);font-size:14px;padding:2.5rem;text-align:center}
.warn-box{color:var(--warn-text);font-size:12px;padding:.6rem 1rem;background:var(--warn-bg);border-radius:var(--r);margin-bottom:.75rem}
.data-date{font-size:11px;color:var(--text3);margin-top:1rem;text-align:right}
.data-date a{color:var(--info-text);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <div class="page-title">
      <span>📊</span>
      可轉債（CB）資訊儀表板
      <span class="tag">台灣 OTC</span>
    </div>
    <div class="top-actions">
      <a class="btn" href="https://www.tpex.org.tw/zh-tw/bond/info/statistics-cb/day.html" target="_blank">↗ 櫃買中心</a>
      <select id="selYear" class="sel" onchange="updateDayList()"></select>
      <select id="selMonth" class="sel" onchange="updateDayList()"></select>
      <select id="selDay" class="sel" onchange="loadData()"></select>
      <button class="btn" onclick="loadData()">↺ 重新整理</button>
    </div>
  </div>

  <!-- Logic -->
  <div class="section-label">▌ 資優生挑選邏輯</div>
  <div class="logic-box">
    <div class="logic-step"><div class="logic-num">步驟 1</div><div class="logic-text">轉換收益排列</div></div>
    <div class="logic-arrow">→</div>
    <div class="logic-step"><div class="logic-num">步驟 2</div><div class="logic-text">CB 價格降冪排序</div></div>
    <div class="logic-arrow">→</div>
    <div class="logic-step"><div class="logic-num">步驟 3</div><div class="logic-text">理論價 90–120</div></div>
    <div class="logic-arrow">→</div>
    <div class="logic-step"><div class="logic-num">步驟 4</div><div class="logic-text">挑選高折溢價 %</div></div>
  </div>

  <!-- Thresholds -->
  <div class="section-label">▌ 折溢價篩選門檻（每年不同，以 2019 為例）</div>
  <div class="thr-grid">
    <div class="thr-card"><div class="thr-range">理論價 90–100</div><div class="thr-label">最低溢價門檻</div><div class="thr-val">&gt;15%</div></div>
    <div class="thr-card"><div class="thr-range">理論價 100–110</div><div class="thr-label">最低溢價門檻</div><div class="thr-val">&gt;7.5%</div></div>
    <div class="thr-card"><div class="thr-range">理論價 110–120</div><div class="thr-label">最低溢價門檻</div><div class="thr-val">&gt;3.5%</div></div>
  </div>

  <!-- Metrics -->
  <div id="metrics-area">
    <div class="metric-grid"><div class="metric"><div class="m-label">載入中...</div><div class="m-value">—</div></div></div>
  </div>

  <!-- Warn -->
  <div id="warn-area"></div>

  <!-- Filter -->
  <div class="filter-bar">
    <label>CB 價格</label>
    <select id="priceFilter" class="sel" onchange="renderTable()">
      <option value="all">全部</option>
      <option value="90-100">90–100</option>
      <option value="100-110">100–110</option>
      <option value="110-120">110–120</option>
      <option value="120+">120+</option>
    </select>
    <label>排序</label>
    <button class="sort-btn active" id="sortPremium" onclick="setSort('premium')">溢價率 ↓</button>
    <button class="sort-btn" id="sortPrice" onclick="setSort('price')">CB價格 ↓</button>
    <button class="sort-btn" id="sortConv" onclick="setSort('conv')">轉換價值 ↓</button>
    <button class="sort-btn" id="sortName" onclick="setSort('name')">名稱</button>
    <input type="text" id="searchBox" class="sel" placeholder="搜尋代號/名稱…" oninput="renderTable()" style="width:130px">
  </div>

  <div id="table-area"><div class="msg">資料載入中…</div></div>

  <!-- Charts -->
  <div class="two-col" id="charts-area" style="display:none">
    <div class="chart-card">
      <div class="section-label">▌ 轉換溢價率分布（2019 研究參考）</div>
      <div style="position:relative;height:220px"><canvas id="distChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="section-label">▌ CB 收盤價區間分布</div>
      <div style="position:relative;height:220px"><canvas id="pieChart"></canvas></div>
    </div>
  </div>
  <div class="data-date" id="dataDate"></div>
</div>

<script>
const WORKER = 'https://tpex-proxy.yuishien.workers.dev';
let allData = [];
let sortKey = 'premium';
let distChart = null, pieChart = null;

function badge(p) {
  // 以溢價率判斷（thefew.tw 的 premium 是轉換溢價率，越低越好）
  // 轉換溢價率低 = CB 相對便宜 = 資優生
  if (p <= 15) return '<span class="badge badge-star">⭐ 低溢價</span>';
  if (p <= 30) return '<span class="badge badge-ok">觀察</span>';
  if (p <= 60) return '<span class="badge badge-hi">偏高</span>';
  return '<span class="badge badge-na">高溢價</span>';
}

function setSort(k) {
  sortKey = k;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  const map = {premium:'sortPremium', price:'sortPrice', conv:'sortConv', name:'sortName'};
  document.getElementById(map[k]).classList.add('active');
  renderTable();
}

function getFiltered() {
  const pf = document.getElementById('priceFilter').value;
  const q  = document.getElementById('searchBox').value.toLowerCase().trim();
  let d = [...allData];
  if (pf !== 'all') {
    const [lo, hi] = pf === '120+' ? [120, 9999] : pf.split('-').map(Number);
    d = d.filter(x => x.cbPrice >= lo && x.cbPrice < hi);
  }
  if (q) d = d.filter(x => x.code.includes(q) || x.name.includes(q));
  if (sortKey === 'premium') d.sort((a,b) => a.premium - b.premium); // 低溢價排前面
  else if (sortKey === 'price') d.sort((a,b) => b.cbPrice - a.cbPrice);
  else if (sortKey === 'conv') d.sort((a,b) => b.convValue - a.convValue);
  else d.sort((a,b) => a.name.localeCompare(b.name,'zh'));
  return d;
}

function renderMetrics(data) {
  const avgP = data.reduce((s,x)=>s+x.premium,0)/data.length;
  const avgCB = data.reduce((s,x)=>s+x.cbPrice,0)/data.length;
  const low = data.filter(x=>x.premium<=15).length;
  const under110 = data.filter(x=>x.cbPrice<110).length;
  document.getElementById('metrics-area').innerHTML = `
    <div class="metric-grid">
      <div class="metric"><div class="m-label">可轉債總數</div><div class="m-value">${data.length}</div><div class="m-sub">今日</div></div>
      <div class="metric"><div class="m-label">平均 CB 收盤</div><div class="m-value">${avgCB.toFixed(1)}</div><div class="m-sub">元</div></div>
      <div class="metric"><div class="m-label">平均轉換溢價率</div><div class="m-value">${avgP.toFixed(1)}%</div><div class="m-sub">市場平均</div></div>
      <div class="metric"><div class="m-label">低溢價（≤15%）</div><div class="m-value" style="color:var(--dn)">${low}</div><div class="m-sub">資優生候選</div></div>
      <div class="metric"><div class="m-label">CB價格 &lt;110</div><div class="m-value">${under110}</div><div class="m-sub">具安全邊際</div></div>
    </div>`;
}

function renderTable() {
  const d = getFiltered();
  if (!d.length) { document.getElementById('table-area').innerHTML='<div class="msg">無符合條件的資料</div>'; return; }
  let html = `<div class="table-wrap"><table>
    <thead><tr>
      <th>代號</th><th>名稱</th>
      <th title="CB收盤價">CB收盤</th>
      <th title="漲跌">漲跌</th>
      <th title="轉換價值 = 現股價 ÷ 轉換價 × 100">轉換價值</th>
      <th title="轉換溢價率越低越便宜">溢價率</th>
      <th title="對應股票收盤價">現股價</th>
      <th title="可轉換為股票的換算價格">轉換價</th>
      <th title="到期日">到期日</th>
      <th>評等</th>
    </tr></thead><tbody>`;
  d.forEach(x => {
    var chgColor = x.change > 0 ? 'var(--up)' : x.change < 0 ? 'var(--dn)' : 'var(--text3)';
    var pColor = x.premium > 0 ? (x.premium <= 15 ? 'var(--dn)' : x.premium <= 30 ? 'var(--info-text)' : x.premium > 60 ? 'var(--up)' : 'var(--text)') : 'var(--text3)';
    var barW = x.premium > 0 ? Math.min(x.premium * 1.2, 60) : 0;
    var premiumStr = x.premium !== 0 ? x.premium.toFixed(1)+'%' : '—';
    var convValStr = x.convValue > 0 ? x.convValue.toFixed(2) : '—';
    html += '<tr>' +
      '<td class="code-cell">' + x.code + '</td>' +
      '<td style="max-width:90px;overflow:hidden;text-overflow:ellipsis;">' + x.name + '</td>' +
      '<td style="font-weight:600">' + x.cbPrice.toFixed(1) + '</td>' +
      '<td style="color:' + chgColor + ';font-weight:500">' + (x.change > 0 ? '+' : '') + (x.change || 0).toFixed(2) + '</td>' +
      '<td>' + convValStr + '</td>' +
      '<td><div class="bar-row"><span class="bar-val" style="color:' + pColor + '">' + premiumStr + '</span>' +
        (barW > 0 ? '<div class="bar-track"><div class="bar-fill" style="width:' + barW + 'px;background:' + pColor + '"></div></div>' : '') +
      '</div></td>' +
      '<td>' + (x.stockPrice > 0 ? x.stockPrice.toFixed(2) : '—') + '</td>' +
      '<td>' + (x.convPrice > 0 ? x.convPrice.toFixed(2) : '—') + '</td>' +
      '<td style="font-size:12px;color:var(--text3)">' + (x.maturity || '—') + '</td>' +
      '<td>' + badge(x.premium) + '</td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('table-area').innerHTML = html;
}

function renderCharts(data) {
  document.getElementById('charts-area').style.display = 'grid';
  var buckets = [
    {label:'<=15%',lo:0,hi:15},{label:'16-30%',lo:16,hi:30},
    {label:'31-60%',lo:31,hi:60},{label:'61-100%',lo:61,hi:100},{label:'>100%',lo:101,hi:9999}
  ];
  var counts = buckets.map(function(b){ return data.filter(function(x){ return x.premium>=b.lo && x.premium<=b.hi; }).length; });
  var colors = ['#1d9e75','#185fa5','#d85a30','#854f0b','#888'];

  if (distChart) distChart.destroy();
  distChart = new Chart(document.getElementById('distChart'), {
    type: 'bar',
    data: { labels: buckets.map(function(b){ return b.label; }), datasets: [{data:counts, backgroundColor:colors, borderRadius:4}] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { font: {size:11}, color:'#888' }, grid: { display: false } },
        y: { ticks: { font: {size:11}, color:'#888' }, grid: { color:'rgba(128,128,128,0.1)' } }
      }
    }
  });

  var pBuckets = [{label:'<100',lo:0,hi:100},{label:'100-110',lo:100,hi:110},{label:'110-120',lo:110,hi:120},{label:'>120',lo:120,hi:9999}];
  var pCounts = pBuckets.map(function(b){ return data.filter(function(x){ return x.cbPrice>=b.lo && x.cbPrice<b.hi; }).length; });
  var total = pCounts.reduce(function(a,b){ return a+b; }, 0);

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: pBuckets.map(function(b){ return b.label; }),
      datasets: [{data:pCounts, backgroundColor:['#185fa5','#1d9e75','#d85a30','#854f0b'], borderWidth:0, hoverOffset:6}]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'right',
          labels: {
            font: {size:11}, boxWidth:10, padding:8,
            generateLabels: function(chart) {
              var ds = chart.data.datasets[0];
              return chart.data.labels.map(function(label, i) {
                return {
                  text: label + '  ' + (total>0 ? Math.round(ds.data[i]/total*100) : 0) + '%',
                  fillStyle: ds.backgroundColor[i],
                  strokeStyle: ds.backgroundColor[i],
                  lineWidth: 0,
                  index: i
                };
              });
            }
          }
        },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var pct = total>0 ? (ctx.parsed/total*100).toFixed(1) : 0;
              return ' ' + ctx.parsed + ' 檔 (' + pct + '%)';
            }
          }
        }
      }
    }
  });
}

// 日期選擇器初始化
(function initDateSelectors() {
  const today = new Date();
  const curY = today.getFullYear();
  const curM = today.getMonth() + 1;

  const selYear = document.getElementById('selYear');
  if (selYear) {
    for (let y = curY; y >= 2015; y--) {
      const o = document.createElement('option');
      o.value = y; o.text = y + '年 (民' + (y-1911) + ')';
      if (y === curY) o.selected = true;
      selYear.appendChild(o);
    }
  }

  const selMonth = document.getElementById('selMonth');
  if (selMonth) {
    for (let m = 1; m <= 12; m++) {
      const o = document.createElement('option');
      o.value = String(m).padStart(2,'0');
      o.text = m + '月';
      if (m === curM) o.selected = true;
      selMonth.appendChild(o);
    }
  }

  updateDayList(today.getDate(), true);
})();

async function updateDayList(selectDay, tryFetch) {
  const yyyy = document.getElementById('selYear') ? document.getElementById('selYear').value : new Date().getFullYear();
  const mm = document.getElementById('selMonth') ? document.getElementById('selMonth').value : String(new Date().getMonth()+1).padStart(2,'0');
  const today = new Date();
  const daysInMonth = new Date(parseInt(yyyy), parseInt(mm), 0).getDate();
  const selDay = document.getElementById('selDay');
  if (!selDay) return;
  const prevVal = selectDay || selDay.value;
  selDay.innerHTML = '';
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = String(d).padStart(2,'0');
    const date = new Date(yyyy + '-' + mm + '-' + ds);
    if (date.getDay() === 0 || date.getDay() === 6) continue;
    if (date > today) continue;
    const o = document.createElement('option');
    o.value = ds; o.text = d + '日';
    selDay.appendChild(o);
  }
  const opts = Array.from(selDay.options).map(function(o){ return o.value; });
  if (opts.includes(String(prevVal).padStart(2,'0'))) {
    selDay.value = String(prevVal).padStart(2,'0');
  } else {
    selDay.selectedIndex = selDay.options.length - 1;
  }
  if (tryFetch) {
    await autoFindLatestDate();
  } else {
    loadData();
  }
}

async function autoFindLatestDate() {
  for (let attempt = 0; attempt < 10; attempt++) {
    const yyyy = document.getElementById('selYear').value;
    const mm = document.getElementById('selMonth').value;
    const dd = document.getElementById('selDay').value;
    if (!dd) break;
    const dateISO = yyyy + '-' + mm + '-' + dd;
    try {
      const res = await fetch(WORKER + '?d=' + dateISO);
      if (res.ok) {
        const json = await res.json();
        if (json.count > 0) { loadData(); return; }
      }
    } catch(e) {}
    let cur = new Date(yyyy + '-' + mm + '-' + dd);
    cur.setDate(cur.getDate() - 1);
    while (cur.getDay() === 0 || cur.getDay() === 6) cur.setDate(cur.getDate() - 1);
    const ny = cur.getFullYear();
    const nm = cur.getMonth() + 1;
    const nd = cur.getDate();
    if (String(nm).padStart(2,'0') !== mm || ny !== parseInt(yyyy)) {
      document.getElementById('selYear').value = ny;
      document.getElementById('selMonth').value = String(nm).padStart(2,'0');
      await updateDayList(nd, false);
      document.getElementById('selDay').value = String(nd).padStart(2,'0');
    } else {
      document.getElementById('selDay').value = String(nd).padStart(2,'0');
    }
  }
  loadData();
}

function getSelectedDateISO() {
  const yyyy = document.getElementById('selYear') ? document.getElementById('selYear').value : new Date().getFullYear();
  const mm = document.getElementById('selMonth') ? document.getElementById('selMonth').value : String(new Date().getMonth()+1).padStart(2,'0');
  const dd = document.getElementById('selDay') ? document.getElementById('selDay').value : String(new Date().getDate()).padStart(2,'0');
  return yyyy + '-' + mm + '-' + dd;
}

async function loadData() {
  document.getElementById('table-area').innerHTML = '<div class="msg">資料載入中…</div>';
  document.getElementById('warn-area').innerHTML = '';

  const dateISO = getSelectedDateISO();
  const [yyyy, mm, dd] = dateISO.split('-');
  const rocYear = parseInt(yyyy) - 1911;
  const displayDate = rocYear + '/' + mm + '/' + dd;

  try {
    // 同時抓兩個資料來源
    const CONV_URL = 'https://yuishien-a11y.github.io/CB/conv_price.json';
    const CSV_URL = WORKER + '/tpex?d=' + dateISO;

    const [convRes, csvRes] = await Promise.allSettled([
      fetch(CONV_URL),
      fetch(CSV_URL)
    ]);

    // 解析轉換價 JSON
    var convMap = {};
    if (convRes.status === 'fulfilled' && convRes.value.ok) {
      const convJson = await convRes.value.json();
      convMap = convJson.data || {};
    }

    // 解析 tpex CSV
    if (csvRes.status !== 'fulfilled' || !csvRes.value.ok) {
      throw new Error('CSV 載入失敗');
    }
    const csvText = await csvRes.value.text();
    if (csvText.trim().startsWith('{')) {
      const errJson = JSON.parse(csvText);
      throw new Error(errJson.error || '無資料');
    }

    const rows = [];
    for (const line of csvText.split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return l; })) {
      if (!line.startsWith('BODY')) continue;
      const cols = line.split('","').map(function(c){ return c.replace(/^BODY,"|"/g,'').replace(/"/g,'').trim(); });
      if (cols[2] !== '等價') continue;
      const code = cols[0].replace(/BODY,/,'').trim();
      if (!code || !/^\d+/.test(code) || code === '合計') continue;
      const cbPrice = parseFloat(cols[3].replace(/,/g,'')) || parseFloat(cols[12].replace(/,/g,'')) || 0;
      if (cbPrice < 70 || cbPrice > 600) continue;

      const conv = convMap[code] || {};
      const convPrice = conv.conv_price || 0;
      const maturity = conv.maturity || '';
      const stockCode = conv.stock_code || code.slice(0,-1);

      // 計算轉換相關數值（若有轉換價）
      // 需要現股價才能算，先存 0，之後前端可以用 TWSE API 補
      rows.push({
        code, name: cols[1].trim(), cbPrice,
        change: parseFloat(cols[4].replace(/,/g,'')) || 0,
        high: parseFloat(cols[6].replace(/,/g,'')) || 0,
        low: parseFloat(cols[7].replace(/,/g,'')) || 0,
        refPrice: parseFloat(cols[12].replace(/,/g,'')) || 0,
        stopUp: parseFloat(cols[13].replace(/,/g,'')) || 0,
        stopDn: parseFloat(cols[14].replace(/,/g,'')) || 0,
        convPrice, maturity, stockCode,
        convValue: 0, premium: 0, stockPrice: 0,
      });
    }

    if (rows.length === 0) throw new Error(displayDate + ' 無資料（可能為假日）');

    // 抓現股收盤價（TWSE）
    try {
      const stockRes = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL');
      if (stockRes.ok) {
        const stockData = await stockRes.json();
        const stockMap = {};
        stockData.forEach(function(s){ stockMap[s.Code] = parseFloat(s.ClosingPrice) || 0; });
        rows.forEach(function(r) {
          const sp = stockMap[r.stockCode] || 0;
          r.stockPrice = sp;
          if (r.convPrice > 0 && sp > 0) {
            r.convValue = parseFloat((sp / r.convPrice * 100).toFixed(2));
            r.premium = parseFloat(((r.cbPrice / r.convValue - 1) * 100).toFixed(2));
          }
        });
      }
    } catch(e) {}

    allData = rows;
    document.getElementById('dataDate').innerHTML =
      '資料日期：' + displayDate + '（民國）&nbsp;·&nbsp;共 ' + allData.length + ' 檔&nbsp;·&nbsp;' +
      '轉換價來源：<a href="https://data.gov.tw/dataset/11406" target="_blank">政府開放資料</a>&nbsp;·&nbsp;' +
      '行情來源：<a href="https://www.tpex.org.tw/zh-tw/bond/info/statistics-cb/day.html" target="_blank">櫃買中心</a>';

  } catch(e) {
    allData = [];
    document.getElementById('warn-area').innerHTML =
      '<div class="warn-box">⚠ ' + e.message + ' &nbsp;<button class="btn" onclick="loadData()" style="margin-left:8px">重試</button></div>';
    document.getElementById('table-area').innerHTML = '<div class="msg">載入失敗，請點重試</div>';
    document.getElementById('dataDate').textContent = '';
    return;
  }

  if (allData.length > 0) {
    renderMetrics(allData);
    renderTable();
    renderCharts(allData);
  } else {
    document.getElementById('table-area').innerHTML = '<div class="msg">目前無資料，請稍後重試</div>';
  }
}

loadData();
</script>
