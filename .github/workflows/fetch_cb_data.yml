name: 每日更新可轉債基本資料

on:
  schedule:
    - cron: '30 7 * * 1-5'  # 台灣時間 15:30
  workflow_dispatch:        # 允許手動觸發

jobs:
  fetch-cb-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 下載可轉債基本資料 CSV
        run: |
          curl -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Referer: https://data.gov.tw/dataset/11406" \
            -H "Accept: text/html,application/xhtml+xml,*/*" \
            --compressed \
            -o ISSBD5_raw.csv \
            "https://www.tpex.org.tw/storage/bond_publish/ISSBD5_data.csv"

      - name: 安裝 Python 套件
        run: pip install chardet requests yfinance pandas numpy

      - name: 解析 CSV 產生 conv_price.json
        run: |
          python3 << 'PYEOF'
          import csv, json, chardet, re
          from datetime import datetime
          
          try:
              with open('ISSBD5_raw.csv', 'rb') as f:
                  raw = f.read()
              detected = chardet.detect(raw)
              encoding = detected.get('encoding', 'big5')
              text = raw.decode(encoding, errors='replace')
              lines = text.strip().split('\n')
              
              result = {}
              header = None
              for i, line in enumerate(lines):
                  cols = [c.strip().strip('"') for c in line.split(',')]
                  if i == 0:
                      header = cols
                      continue
                  if len(cols) < 10:
                      continue
                  cb_code = cols[3].strip()
                  if not re.match(r'^\d{4,6}$', cb_code):
                      continue
                  
                  mat_raw = cols[8].strip()
                  maturity = f"{mat_raw[:4]}-{mat_raw[4:6]}-{mat_raw[6:8]}" if len(mat_raw) == 8 and mat_raw.isdigit() else ''
                  issue_raw = cols[7].strip()
                  issue_date = f"{issue_raw[:4]}-{issue_raw[4:6]}-{issue_raw[6:8]}" if len(issue_raw) == 8 and issue_raw.isdigit() else ''
                  stock_code = cols[1].strip()
                  company = cols[2].strip()
                  
                  conv_price = 0
                  if header:
                      for idx, h in enumerate(header):
                          if '轉換' in h and '價' in h and idx < len(cols):
                              try:
                                  conv_price = float(cols[idx].replace(',','').strip())
                                  break
                              except: pass
                  if conv_price == 0:
                      for idx in range(len(cols)-1, 19, -1):
                          v = cols[idx].replace(',','').strip()
                          if '.' in v:
                              try:
                                  fv = float(v)
                                  if 0 < fv < 9999:
                                      conv_price = fv
                                      break
                              except: pass
                              
                  result[cb_code] = {
                      'stock_code': stock_code, 'company': company, 
                      'conv_price': conv_price, 'maturity': maturity, 'issue_date': issue_date
                  }
                  
              output = {'updated': datetime.now().strftime('%Y-%m-%d %H:%M'), 'count': len(result), 'data': result}
              with open('conv_price.json', 'w', encoding='utf-8') as f:
                  json.dump(output, f, ensure_ascii=False, indent=2)
          except Exception as e:
              print(f"❌ 解析 CSV 失敗: {e}")
          PYEOF

      - name: 抓取最新股價產生 stock_price.json
        run: |
          python3 << 'PYEOF'
          import json
          import yfinance as yf
          import pandas as pd
          import numpy as np
          import requests
          
          stock_prices = {}
          headers = {'User-Agent': 'Mozilla/5.0'}
          
          # 1. 證交所 API
          try:
              res = requests.get('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL', headers=headers, timeout=10).json()
              for s in res:
                  if s.get('Code') and s.get('ClosingPrice'):
                      try: stock_prices[s['Code']] = float(s['ClosingPrice'].replace(',', ''))
                      except: pass
          except: pass

          # 2. 櫃買中心 OpenAPI (1)
          try:
              res = requests.get('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes', headers=headers, timeout=10).json()
              for s in res:
                  c = str(s.get('SecuritiesCompanyCode', s.get('Code', s.get('Symbol', '')))).strip()
                  p = s.get('Close', s.get('ClosingPrice', s.get('CurrentPrice', '')))
                  if c and p and c not in stock_prices:
                      try: stock_prices[c] = float(str(p).replace(',', ''))
                      except: pass
          except: pass

          # 3. 櫃買中心 OpenAPI (2)
          try:
              res = requests.get('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes', headers=headers, timeout=10).json()
              for s in res:
                  c = str(s.get('SecuritiesCompanyCode', s.get('Code', s.get('Symbol', '')))).strip()
                  p = s.get('Close', s.get('ClosingPrice', s.get('CurrentPrice', '')))
                  if c and p and c not in stock_prices:
                      try: stock_prices[c] = float(str(p).replace(',', ''))
                      except: pass
          except: pass

          # 4. 櫃買中心 Web API
          try:
              res = requests.get('https://www.tpex.org.tw/web/stock/aftertrading/otc_quotes_no1430/stk_wn1430_result.php?l=zh-tw&o=json', headers=headers, timeout=10).json()
              for row in res.get('aaData', []):
                  c = str(row[0]).strip()
                  p = str(row[2]).replace(',', '')
                  if len(c) <= 5 and c not in stock_prices:
                      try: stock_prices[c] = float(p)
                      except: pass
          except: pass

          # 5. Yahoo Finance 終極備援 (往前翻找5天的最後收盤價)
          try:
              with open('conv_price.json', 'r', encoding='utf-8') as f:
                  conv_data = json.load(f)
              
              needed_codes = list(set([cb.get('stock_code') for cb in conv_data.get('data', {}).values() if cb.get('stock_code')]))
              missing_codes = [c for c in needed_codes if c not in stock_prices]
              
              if missing_codes:
                  print(f"啟動 Yahoo Finance 備援，補齊 {len(missing_codes)} 檔股票...")
                  for i in range(0, len(missing_codes), 20):
                      chunk = missing_codes[i:i+20]
                      all_tickers = [f"{c}.TW" for c in chunk] + [f"{c}.TWO" for c in chunk]
                      try:
                          # period="5d"：往前抓5天，避免冷門股今天沒交易
                          data = yf.download(all_tickers, period="5d", progress=False)
                          if not data.empty and 'Close' in data:
                              close_data = data['Close']
                              if isinstance(close_data, pd.DataFrame):
                                  # ffill() 將空值用前一天的價格補齊，然後拿最後一天 (iloc[-1])
                                  last_prices = close_data.ffill().iloc[-1].dropna()
                                  for ticker, price in last_prices.items():
                                      code = ticker.split('.')[0]
                                      if price > 0 and code not in stock_prices:
                                          stock_prices[code] = round(float(price), 2)
                              else:
                                  price = close_data.ffill().iloc[-1]
                                  if pd.notna(price) and price > 0:
                                      code = all_tickers[0].split('.')[0]
                                      if code not in stock_prices:
                                          stock_prices[code] = round(float(price), 2)
                      except Exception as e:
                          print(f"Yahoo 抓取錯誤: {e}")
          except Exception as e:
              print(f"備援發生錯誤: {e}")

          try:
              with open('stock_price.json', 'w', encoding='utf-8') as f:
                  json.dump(stock_prices, f, ensure_ascii=False)
              print(f"✅ 最終產出 stock_price.json，共 {len(stock_prices)} 筆股價資料。")
          except Exception as e:
              print(f"❌ 存檔失敗: {e}")
          PYEOF

      - name: Commit & Push 所有 JSON 檔案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conv_price.json stock_price.json
          git diff --staged --quiet || git commit -m "chore: 每日更新可轉債與現股價資料 $(date +'%Y-%m-%d')"
          git push || echo "No changes to push."
