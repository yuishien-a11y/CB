export default {
  async fetch(request) {
    const corsHeaders = {
      'Access-Control-Allow-Origin': '*',
      'Access-Control-Allow-Methods': 'GET, OPTIONS',
      'Access-Control-Allow-Headers': 'Content-Type',
    };
    if (request.method === 'OPTIONS') return new Response(null, { headers: corsHeaders });

    const url = new URL(request.url);
    const dateParam = url.searchParams.get('d') || new Date().toISOString().split('T')[0];
    const [yyyy, mm, dd] = dateParam.split('-');
    const csvUrl = `https://www.tpex.org.tw/storage/bond_zone/tradeinfo/cb/${yyyy}/${yyyy}${mm}/RSta0113.${yyyy}${mm}${dd}-C.csv`;

    try {
      // 指定從亞洲節點發出請求（Cloudflare TPE/NRT 節點）
      const res = await fetch(csvUrl, {
        cf: {
          // 強制用亞洲節點
          resolveOverride: 'www.tpex.org.tw',
        },
        headers: {
          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
          'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          'Accept-Language': 'zh-TW,zh;q=0.9',
          'Accept-Encoding': 'gzip, deflate, br',
          'Referer': 'https://www.tpex.org.tw/zh-tw/bond/info/statistics-cb/day.html',
          'Sec-Fetch-Dest': 'document',
          'Sec-Fetch-Mode': 'navigate',
          'Sec-Fetch-Site': 'same-origin',
          'Cache-Control': 'no-cache',
        }
      });

      if (!res.ok) {
        return new Response(JSON.stringify({ 
          error: `HTTP ${res.status}`, 
          date: dateParam,
          url: csvUrl,
          cf_ray: request.headers.get('cf-ray'),
          cf_ipcountry: request.headers.get('cf-ipcountry'),
        }), { status: res.status, headers: { ...corsHeaders, 'Content-Type': 'application/json' } });
      }

      const buffer = await res.arrayBuffer();
      const text = new TextDecoder('big5').decode(buffer);
      
      if (!text.includes('BODY') || !text.includes('TITLE')) {
        return new Response(JSON.stringify({ 
          error: '回傳內容不是 CB 資料', 
          preview: text.substring(0, 200),
          date: dateParam 
        }), { status: 404, headers: { ...corsHeaders, 'Content-Type': 'application/json' } });
      }

      return new Response(text, {
        headers: { ...corsHeaders, 'Content-Type': 'text/plain; charset=utf-8', 'Cache-Control': 'public, max-age=3600' }
      });

    } catch(e) {
      return new Response(JSON.stringify({ error: e.message, date: dateParam }), {
        status: 500, headers: { ...corsHeaders, 'Content-Type': 'application/json' }
      });
    }
  }
};
