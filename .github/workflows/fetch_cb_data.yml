name: 每日更新可轉債基本資料

on:
  schedule:
    - cron: '30 7 * * 1-5'  # 台灣時間 15:30
  workflow_dispatch:        # 允許手動觸發

jobs:
  fetch-cb-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 下載可轉債基本資料 CSV
        run: |
          curl -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Referer: https://data.gov.tw/dataset/11406" \
            -H "Accept: text/html,application/xhtml+xml,*/*" \
            --compressed \
            -o ISSBD5_raw.csv \
            "https://www.tpex.org.tw/storage/bond_publish/ISSBD5_data.csv"

      - name: 安裝 Python 套件
        run: pip install chardet requests yfinance pandas numpy

      - name: 解析 CSV 產生 conv_price.json (包含轉換率進階計算)
        run: |
          python3 << 'PYEOF'
          import csv, json, chardet, re
          from datetime import datetime
          from io import StringIO
          
          try:
              with open('ISSBD5_raw.csv', 'rb') as f:
                  raw = f.read()
              detected = chardet.detect(raw)
              encoding = detected.get('encoding', 'big5')
              text = raw.decode(encoding, errors='replace')
              
              reader = csv.reader(StringIO(text))
              
              result = {}
              idx_cb_code, idx_stock_code, idx_company = -1, -1, -1
              idx_mat, idx_issue, idx_conv = -1, -1, -1
              idx_issue_amt, idx_remain_amt = -1, -1
              
              # 💡 增強版數字解析器：能看懂 1,000,000 也看得懂 10億
              def parse_amt(s):
                  s = s.replace(',', '').strip()
                  if not s: return -1
                  m = re.search(r'[\d.]+', s)
                  if not m: return -1
                  val = float(m.group())
                  if '億' in s: val *= 100000000
                  elif '萬' in s: val *= 10000
                  return val
              
              for i, cols in enumerate(reader):
                  cols = [c.strip() for c in cols]
                  if i == 0:
                      header = cols
                      for j, h in enumerate(header):
                          h_clean = h.replace(' ', '').replace('\u3000', '')
                          if '債券代' in h_clean: idx_cb_code = j
                          elif '公司代' in h_clean: idx_stock_code = j
                          elif '公司名' in h_clean: idx_company = j
                          elif '到期日' in h_clean: idx_mat = j
                          elif '發行日' in h_clean: idx_issue = j
                          elif '轉換' in h_clean and '價' in h_clean: idx_conv = j
                          # 聰明抓取「發行總面額」
                          elif ('發行' in h_clean or '面額' in h_clean) and ('總' in h_clean or '金' in h_clean or '額' in h_clean) and '餘' not in h_clean: 
                              idx_issue_amt = j
                          # 聰明抓取「最新發行餘額」
                          elif '目前餘額' in h_clean or ('餘額' in h_clean and '發行' not in h_clean) or '未轉' in h_clean or '在外' in h_clean or '未償' in h_clean: 
                              idx_remain_amt = j
                      
                      # 把官方表頭印出來，方便我們除錯
                      print(f"📌 解析到的表頭: {header}")
                      print(f"📌 判斷的欄位索引: 發行總額={idx_issue_amt}, 剩餘餘額={idx_remain_amt}")
                      continue
                      
                  if len(cols) < 5:
                      continue
                      
                  cb_code = cols[idx_cb_code] if idx_cb_code != -1 else cols[3]
                  if not re.match(r'^\d{4,6}$', cb_code):
                      continue
                  
                  stock_code = cols[idx_stock_code] if idx_stock_code != -1 else cols[1]
                  company = cols[idx_company] if idx_company != -1 else cols[2]
                  
                  mat_raw = cols[idx_mat].strip() if idx_mat != -1 else (cols[8].strip() if len(cols)>8 else '')
                  maturity = f"{mat_raw[:4]}-{mat_raw[4:6]}-{mat_raw[6:8]}" if len(mat_raw) == 8 and mat_raw.isdigit() else ''
                  
                  issue_raw = cols[idx_issue].strip() if idx_issue != -1 else (cols[7].strip() if len(cols)>7 else '')
                  issue_date = f"{issue_raw[:4]}-{issue_raw[4:6]}-{issue_raw[6:8]}" if len(issue_raw) == 8 and issue_raw.isdigit() else ''
                  
                  conv_price = 0
                  if idx_conv != -1 and idx_conv < len(cols):
                      try: conv_price = float(cols[idx_conv].replace(',','').strip())
                      except: pass
                  if conv_price == 0:
                      for idx in range(len(cols)-1, max(0, len(cols)-5), -1):
                          v = cols[idx].replace(',','').strip()
                          if '.' in v:
                              try:
                                  fv = float(v)
                                  if 0 < fv < 9999:
                                      conv_price = fv
                                      break
                              except: pass
                              
                  issue_amt = -1
                  remain_amt = -1
                  # 強制用固定欄位：col[9]=發行總額, col[10]=目前餘額
                  try: issue_amt = parse_amt(cols[9]) if len(cols) > 9 else -1
                  except: issue_amt = -1
                  try: remain_amt = parse_amt(cols[10]) if len(cols) > 10 else -1
                  except: remain_amt = -1
                  # 備援：用動態偵測的欄位
                  if issue_amt <= 0 and idx_issue_amt != -1 and idx_issue_amt < len(cols):
                      issue_amt = parse_amt(cols[idx_issue_amt])
                  if remain_amt <= 0 and idx_remain_amt != -1 and idx_remain_amt < len(cols) and idx_remain_amt != idx_issue_amt:
                      remain_amt = parse_amt(cols[idx_remain_amt])
                      
                  # 💡 核心計算：(發行總額 - 剩餘餘額) / 發行總額
                  conv_ratio = None
                  if issue_amt > 0 and remain_amt >= 0 and issue_amt >= remain_amt:
                      conv_ratio = round((issue_amt - remain_amt) / issue_amt * 100, 2)
                      
                  result[cb_code] = {
                      'stock_code': stock_code, 'company': company, 
                      'conv_price': conv_price, 'maturity': maturity, 'issue_date': issue_date,
                      'conv_ratio': conv_ratio
                  }
                  
              output = {'updated': datetime.now().strftime('%Y-%m-%d %H:%M'), 'count': len(result), 'data': result}
              with open('conv_price.json', 'w', encoding='utf-8') as f:
                  json.dump(output, f, ensure_ascii=False, indent=2)
              print(f"✅ 成功解析 CSV，產出 {len(result)} 筆資料，已加入轉換率。")
          except Exception as e:
              print(f"❌ 解析 CSV 失敗: {e}")
          PYEOF

      - name: 抓取最新股價產生 stock_price.json
        run: |
          python3 << 'PYEOF'
          import json
          import yfinance as yf
          import pandas as pd
          import numpy as np
          import requests
          
          stock_prices = {}
          headers = {'User-Agent': 'Mozilla/5.0'}
          
          # 1. 證交所 API
          try:
              res = requests.get('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL', headers=headers, timeout=10).json()
              for s in res:
                  if s.get('Code') and s.get('ClosingPrice'):
                      try: stock_prices[s['Code']] = float(s['ClosingPrice'].replace(',', ''))
                      except: pass
          except: pass

          # 2. 櫃買中心 OpenAPI (1)
          try:
              res = requests.get('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes', headers=headers, timeout=10).json()
              for s in res:
                  c = str(s.get('SecuritiesCompanyCode', s.get('Code', s.get('Symbol', '')))).strip()
                  p = s.get('Close', s.get('ClosingPrice', s.get('CurrentPrice', '')))
                  if c and p and c not in stock_prices:
                      try: stock_prices[c] = float(str(p).replace(',', ''))
                      except: pass
          except: pass

          # 3. 櫃買中心 OpenAPI (2)
          try:
              res = requests.get('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes', headers=headers, timeout=10).json()
              for s in res:
                  c = str(s.get('SecuritiesCompanyCode', s.get('Code', s.get('Symbol', '')))).strip()
                  p = s.get('Close', s.get('ClosingPrice', s.get('CurrentPrice', '')))
                  if c and p and c not in stock_prices:
                      try: stock_prices[c] = float(str(p).replace(',', ''))
                      except: pass
          except: pass

          # 4. 櫃買中心 Web API
          try:
              res = requests.get('https://www.tpex.org.tw/web/stock/aftertrading/otc_quotes_no1430/stk_wn1430_result.php?l=zh-tw&o=json', headers=headers, timeout=10).json()
              for row in res.get('aaData', []):
                  c = str(row[0]).strip()
                  p = str(row[2]).replace(',', '')
                  if len(c) <= 5 and c not in stock_prices:
                      try: stock_prices[c] = float(p)
                      except: pass
          except: pass

          # 5. Yahoo Finance 終極備援
          try:
              with open('conv_price.json', 'r', encoding='utf-8') as f:
                  conv_data = json.load(f)
              
              needed_codes = list(set([cb.get('stock_code') for cb in conv_data.get('data', {}).values() if cb.get('stock_code')]))
              missing_codes = [c for c in needed_codes if c not in stock_prices]
              
              if missing_codes:
                  for i in range(0, len(missing_codes), 20):
                      chunk = missing_codes[i:i+20]
                      all_tickers = [f"{c}.TW" for c in chunk] + [f"{c}.TWO" for c in chunk]
                      try:
                          data = yf.download(all_tickers, period="5d", progress=False)
                          if not data.empty and 'Close' in data:
                              close_data = data['Close']
                              if isinstance(close_data, pd.DataFrame):
                                  last_prices = close_data.ffill().iloc[-1].dropna()
                                  for ticker, price in last_prices.items():
                                      code = ticker.split('.')[0]
                                      if price > 0 and code not in stock_prices:
                                          stock_prices[code] = round(float(price), 2)
                              else:
                                  price = close_data.ffill().iloc[-1]
                                  if pd.notna(price) and price > 0:
                                      code = all_tickers[0].split('.')[0]
                                      if code not in stock_prices:
                                          stock_prices[code] = round(float(price), 2)
                      except Exception as e:
                          pass
          except Exception as e:
              pass

          try:
              with open('stock_price.json', 'w', encoding='utf-8') as f:
                  json.dump(stock_prices, f, ensure_ascii=False)
          except Exception as e:
              pass
          PYEOF

      - name: Commit & Push 所有 JSON 檔案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conv_price.json stock_price.json
          git diff --staged --quiet || git commit -m "chore: 每日更新可轉債與現股價資料 $(date +'%Y-%m-%d')"
          git push || echo "No changes to push."
