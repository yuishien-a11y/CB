name: 每日更新可轉債基本資料

on:
  schedule:
    - cron: '30 7 * * 1-5'  # 台灣時間 15:30
  workflow_dispatch:        # 允許手動觸發

jobs:
  fetch-cb-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 1. 下載基本資料 CSV (轉換價)
        run: |
          curl -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Referer: https://data.gov.tw/dataset/11406" \
            --compressed \
            -o ISSBD5_raw.csv \
            "https://www.tpex.org.tw/storage/bond_publish/ISSBD5_data.csv"

      - name: 安裝 Python 套件
        run: pip install chardet requests yfinance pandas numpy

      - name: 2. 透過 Proxy 繞道抓取「餘額表」並合併資料
        run: |
          python3 << 'PYEOF'
          import csv, json, chardet, re, requests
          from datetime import datetime
          from io import StringIO
          
          # ==========================================
          # 第一步：繞過防火牆，抓取發行餘額表
          # ==========================================
          bal_data = {}
          target_url = "https://www.tpex.org.tw/web/bond/publish/convertible_bond_search/cvb_bal_result.php?l=zh-tw&o=json&iDisplayLength=10000"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Referer": "https://www.tpex.org.tw/web/bond/publish/convertible_bond_search/cvb_bal.php?l=zh-tw"
          }
          
          # 備用代理通道 (如果被 TPEx 擋掉，就用這些通道繞過去)
          proxies = [
              target_url, # 先嘗試直連
              f"https://api.allorigins.win/raw?url={target_url}",
              f"https://api.codetabs.com/v1/proxy?quest={target_url}"
          ]
          
          bal_json = None
          for url in proxies:
              print(f"⏳ 嘗試連線: {url[:50]}...")
              try:
                  res = requests.get(url, headers=headers, timeout=15)
                  res.raise_for_status()
                  bal_json = res.json()
                  if 'aaData' in bal_json:
                      print("✅ 成功取得發行餘額資料！")
                      break
              except Exception as e:
                  print(f"❌ 連線失敗: {e}")
                  
          if bal_json and 'aaData' in bal_json:
              rows = bal_json.get('aaData', [])
              print(f"📌 共撈回 {len(rows)} 筆可轉債餘額數據")
              for row in rows:
                  if len(row) < 7: continue
                  code = str(row[0]).strip()
                  code = re.sub(r'<[^>]+>', '', code).strip() # 清除 HTML 標籤
                  if not re.match(r'^\d{4,6}$', code): continue
                  try:
                      issue_amt = float(str(row[5]).replace(',', '').strip())  # 發行總額
                      remain_amt = float(str(row[6]).replace(',', '').strip()) # 流通餘額
                      bal_data[code] = {'issue': issue_amt, 'remain': remain_amt}
                  except: pass
          else:
              print("⚠️ 警告：所有備用通道均被阻擋，本次將無法顯示轉換率。")

          # ==========================================
          # 第二步：讀取 CSV 並合併資料
          # ==========================================
          try:
              with open('ISSBD5_raw.csv', 'rb') as f:
                  raw = f.read()
              encoding = chardet.detect(raw).get('encoding', 'big5')
              text = raw.decode(encoding, errors='replace')
              reader = csv.reader(StringIO(text))
              
              result = {}
              idx_cb_code, idx_stock_code, idx_company, idx_mat, idx_conv = -1, -1, -1, -1, -1
              
              for i, cols in enumerate(reader):
                  cols = [c.strip() for c in cols]
                  if i == 0:
                      for j, h in enumerate(cols):
                          h_clean = h.replace(' ', '').replace('\u3000', '')
                          if '債券代' in h_clean: idx_cb_code = j
                          elif '公司代' in h_clean: idx_stock_code = j
                          elif '公司名' in h_clean: idx_company = j
                          elif '到期日' in h_clean: idx_mat = j
                          elif '轉換' in h_clean and '價' in h_clean: idx_conv = j
                      continue
                      
                  cb_code = cols[idx_cb_code] if idx_cb_code != -1 else cols[3]
                  if not re.match(r'^\d{4,6}$', cb_code): continue
                  
                  stock_code = cols[idx_stock_code] if idx_stock_code != -1 else cols[1]
                  company = cols[idx_company] if idx_company != -1 else cols[2]
                  
                  mat_raw = cols[idx_mat].strip() if idx_mat != -1 else cols[8].strip()
                  maturity = f"{mat_raw[:4]}-{mat_raw[4:6]}-{mat_raw[6:8]}" if len(mat_raw) == 8 and mat_raw.isdigit() else ''
                  
                  conv_price = 0
                  if idx_conv != -1 and idx_conv < len(cols):
                      try: conv_price = float(cols[idx_conv].replace(',','').strip())
                      except: pass
                  if conv_price == 0:
                      for idx in range(len(cols)-1, max(0, len(cols)-5), -1):
                          v = cols[idx].replace(',','').strip()
                          if '.' in v:
                              try:
                                  conv_price = float(v)
                                  if 0 < conv_price < 9999: break
                              except: pass
                              
                  # 計算已轉換比例
                  conv_ratio = None
                  if cb_code in bal_data:
                      issue = bal_data[cb_code]['issue']
                      remain = bal_data[cb_code]['remain']
                      if issue > 0 and remain >= 0 and issue >= remain:
                          conv_ratio = round((issue - remain) / issue * 100, 2)
                      
                  result[cb_code] = {
                      'stock_code': stock_code, 'company': company, 
                      'conv_price': conv_price, 'maturity': maturity,
                      'conv_ratio': conv_ratio
                  }
                  
              output = {'updated': datetime.now().strftime('%Y-%m-%d %H:%M'), 'count': len(result), 'data': result}
              with open('conv_price.json', 'w', encoding='utf-8') as f:
                  json.dump(output, f, ensure_ascii=False, indent=2)
              print(f"✅ 成功產出 conv_price.json (共 {len(result)} 筆)")
          except Exception as e:
              print(f"❌ 處理 CSV 發生錯誤: {e}")
          PYEOF

      - name: 3. 抓取最新股價產生 stock_price.json
        run: |
          python3 << 'PYEOF'
          import json, requests, numpy as np, pandas as pd, yfinance as yf
          stock_prices = {}
          headers = {'User-Agent': 'Mozilla/5.0'}
          
          try:
              res = requests.get('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL', headers=headers, timeout=10).json()
              for s in res:
                  if s.get('Code') and s.get('ClosingPrice'):
                      try: stock_prices[s['Code']] = float(s['ClosingPrice'].replace(',', ''))
                      except: pass
          except: pass

          for api_url in ['https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes', 'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes']:
              try:
                  res = requests.get(api_url, headers=headers, timeout=10).json()
                  for s in res:
                      c = str(s.get('SecuritiesCompanyCode', s.get('Code', s.get('Symbol', '')))).strip()
                      p = s.get('Close', s.get('ClosingPrice', s.get('CurrentPrice', '')))
                      if c and p and c not in stock_prices:
                          try: stock_prices[c] = float(str(p).replace(',', ''))
                          except: pass
              except: pass

          try:
              with open('conv_price.json', 'r', encoding='utf-8') as f:
                  conv_data = json.load(f)
              needed_codes = list(set([cb.get('stock_code') for cb in conv_data.get('data', {}).values() if cb.get('stock_code')]))
              missing_codes = [c for c in needed_codes if c not in stock_prices]
              if missing_codes:
                  for i in range(0, len(missing_codes), 20):
                      chunk = missing_codes[i:i+20]
                      all_tickers = [f"{c}.TW" for c in chunk] + [f"{c}.TWO" for c in chunk]
                      try:
                          data = yf.download(all_tickers, period="5d", progress=False)
                          if not data.empty and 'Close' in data:
                              close_data = data['Close']
                              if isinstance(close_data, pd.DataFrame):
                                  last_prices = close_data.ffill().iloc[-1].dropna()
                                  for ticker, price in last_prices.items():
                                      code = ticker.split('.')[0]
                                      if price > 0 and code not in stock_prices:
                                          stock_prices[code] = round(float(price), 2)
                              else:
                                  price = close_data.ffill().iloc[-1]
                                  if pd.notna(price) and price > 0:
                                      code = all_tickers[0].split('.')[0]
                                      if code not in stock_prices:
                                          stock_prices[code] = round(float(price), 2)
                      except: pass
          except: pass

          with open('stock_price.json', 'w', encoding='utf-8') as f:
              json.dump(stock_prices, f, ensure_ascii=False)
          PYEOF

      - name: Commit & Push 所有最新變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conv_price.json stock_price.json
          git diff --staged --quiet || git commit -m "chore: 每日更新可轉債與現股價資料 $(date +'%Y-%m-%d')"
          git push || echo "No changes to push."
